# Pinned project name: it drives the network name, independent of the clone directory.
name: proxystack

# Shared relay settings.
x-relay: &relay
  image: alpine/socat:latest
  restart: unless-stopped

services:
  vpn:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: proxystack-vpn:latest
    container_name: proxystack-vpn
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    environment:
      - OC_SERVER=${OC_SERVER}
      - OC_USER=${OC_USER}
      - OC_PASS=${OC_PASS}
      - SOCKS5_USER=${SOCKS5_USER:-}
      - SOCKS5_PASS=${SOCKS5_PASS:-}
      - CONNECT_USER=${HTTPS_USER:-}
      - CONNECT_PASS=${HTTPS_PASS:-}
      - HTTP_USER=${HTTP_USER:-}
      - HTTP_PASS=${HTTP_PASS:-}
      - MTPROTO_FAKE_TLS=${MTPROTO_FAKE_TLS:-cloudflare.com}
      - MTPROTO_SECRET=${MTPROTO_SECRET:-}
    volumes:
      - etc-mtg:/etc/mtg
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show tun0 >/dev/null 2>&1 && nc -z 127.0.0.1 1080 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  socks5:
    <<: *relay
    container_name: proxystack-socks5
    command: TCP-LISTEN:1080,fork,reuseaddr,keepalive,keepidle=45,keepintvl=15,keepcnt=4 TCP:proxystack-vpn:1080
    ports:
      - "${SOCKS_PORT:-2085}:1080"

  https:
    <<: *relay
    container_name: proxystack-https
    command: TCP-LISTEN:3128,fork,reuseaddr,keepalive,keepidle=45,keepintvl=15,keepcnt=4 TCP:proxystack-vpn:3128
    ports:
      - "${HTTPS_PORT:-2443}:3128"

  http:
    <<: *relay
    container_name: proxystack-http
    command: TCP-LISTEN:3129,fork,reuseaddr,keepalive,keepidle=45,keepintvl=15,keepcnt=4 TCP:proxystack-vpn:3129
    ports:
      - "${HTTP_PORT:-2080}:3129"

  mtproto:
    <<: *relay
    container_name: proxystack-mtproto
    command: TCP-LISTEN:8443,fork,reuseaddr,keepalive,keepidle=45,keepintvl=15,keepcnt=4 TCP:proxystack-vpn:8443
    ports:
      - "${MTPROTO_PORT:-2444}:8443"

volumes:
  etc-mtg:
    name: etc-mtg
